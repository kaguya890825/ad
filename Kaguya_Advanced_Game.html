      { text: "問他有沒有遇過危險的情況", next: "danger_talk" },
      { text: "把話題轉到羽片上", next: "feather_talk" },
      { text: "安靜繼續往前走", next: "end_approach" }
    ]
  },
  end_approach: {
    location: "宅邸側門附近",
    time: "傍晚",
    portrait: "lingfeng",
    text: "側門已經近在眼前。凌風停下：「到這裡就好。如果之後想確認方向，用羽片叫我。」\n\n他看了你一眼：「……今天，謝謝你。」",
    choices: [
      { text: "目送他離開", next: "home" },
      { text: "叫住他，再說一句話", next: "last_words" },
      { text: "把羽片握緊，輕聲道謝", next: "home" },
      { text: "問他之後怎麼聯絡比較好", next: "contact_way" }
    ]
  },
  home: {
    location: "宅邸側門",
    time: "傍晚",
    portrait: "kaguya",
    text: "你走進側門。雙印記輕微共鳴，像在確認你平安。\n\n掌心的羽片仍帶著凌風的氣息。\n\n（本章暫告一段落）",
    choices: []
  }
};

function pushHistory() {
  state.history.push(JSON.parse(JSON.stringify(state)));
  if (state.history.length > 20) state.history.shift();
}

function undo() {
  if (state.history.length === 0) return alert("沒有可撤回的步驟");
  const prev = state.history.pop();
  state = prev;
  render();
}

function rewriteLast() {
  if (state.history.length === 0) return alert("沒有上一段可重寫");
  state.history.pop();
  render();
  document.getElementById("story").textContent += "\n\n（已撤回上一段，請重新選擇或輸入行動。）";
}

function freeAction() {
  const input = document.getElementById("free-input").value.trim();
  if (!input) return;
  pushHistory();
  const story = document.getElementById("story");
  story.textContent += `\n\n【你】${input}\n\n（你的話語與行動已被世界記錄。若涉及結侶，必須雙方自願並由你明確同意後才會進行儀式。你可以繼續輸入，或選擇上方的選項。）`;
  state.chronicle.push(`自由行動：${input}`);
  document.getElementById("free-input").value = "";
  story.scrollTop = story.scrollHeight;
  renderSidebar();
  localStorage.setItem("kaguya_full", JSON.stringify(state));
}

function renderPortrait(id) {
  const c = characters[id] || { name: "未知", portrait: null };
  const container = document.getElementById("main-portrait-container");
  if (c.portrait) {
    container.innerHTML = `<img src="${c.portrait}" alt="${c.name}">`;
  } else {
    container.innerHTML = `<div class="portrait-avatar">${(c.name||"?").charAt(0)}</div>`;
  }
  document.getElementById("portrait-name").textContent = c.name || "未知";
}

function renderSidebar() {
  const companionList = document.getElementById("companion-list");
  const futureList = document.getElementById("future-list");
  const familyList = document.getElementById("family-list");
  companionList.innerHTML = futureList.innerHTML = familyList.innerHTML = "";

  document.getElementById("companion-title").textContent = `同行者與羈絆 · 獸夫 ${state.marks.length} 位`;
  document.getElementById("marks").innerHTML = state.marks.map(m => `${m}獸印`).join("<br>") || "無";
  document.getElementById("items").innerHTML = "凌風的羽片<br><small style='color:#8b949e'>注入氣息即可召喚</small>";
  document.getElementById("chronicle").innerHTML = state.chronicle.slice(-8).map(c => "· " + c).join("<br>");

  Object.entries(characters).forEach(([id, c]) => {
    if (!state.known.includes(id) && c.type !== "self") return;
    const card = document.createElement("div");
    card.className = "char-card";
    const avatar = c.portrait ? `<img src="${c.portrait}">` : `<div class="char-avatar">${c.name.charAt(0)}</div>`;
    const aff = state.affection[id] || 0;
    card.innerHTML = `${avatar}<div class="char-info"><div class="char-name">${c.name}</div><div class="char-status">${c.status}</div>${aff>0?`<div class="bar"><div class="bar-fill" style="width:${aff}%"></div></div>`:""}</div>`;
    if (c.type === "companion" || c.type === "self" || state.companions.includes(id)) companionList.appendChild(card);
    else if (c.type === "future") futureList.appendChild(card);
    else if (c.type === "family") familyList.appendChild(card);
  });
}

function render() {
  const scene = scenes[state.scene] || scenes.current_forest;
  document.getElementById("location").textContent = scene.location || state.location;
  document.getElementById("time").textContent = scene.time || state.time;
  document.getElementById("story").textContent = scene.text;
  renderPortrait(scene.portrait);
  renderSidebar();

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";
  (scene.choices || []).slice(0,3).forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = "◆ " + choice.text;
    btn.onclick = () => {
      pushHistory();
      state.scene = choice.next;
      if (scene.location) state.location = scene.location;
      if (scene.time) state.time = scene.time;
      state.chronicle.push(choice.text);
      render();
      localStorage.setItem("kaguya_full", JSON.stringify(state));
    };
    choicesDiv.appendChild(btn);
  });
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function startNew() {
  state = {
    scene: "start_market",
    marks: [],
    companions: [],
    affection: {},
    known: ["kaguya","yelin","shuangyu","lanya","chengyue","chiyan","yuanhai","xuanming","yinya","cangqiong","moying","lieyang","youlan_m","tiexin","shuangren","yeying","yangu","liuguang","anchao","xinghen","chitong","feiying","qingli","yeli","chengshuang","yanxin","youlan_f","shuangyue","liuyun","yanxin_bear","xinghe"],
    history: [],
    chronicle: ["從宅邸側門偷溜出去。"],
    time: "午後",
    location: "森林市集"
  };
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "flex";
  render();
}

function continueCurrent() {
  state.scene = "current_forest";
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "flex";
  render();
}

function loadSave() {
  const saved = localStorage.getItem("kaguya_full");
  if (saved) {
    state = JSON.parse(saved);
    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "flex";
    render();
  } else alert("沒有存檔");
}
</script>
